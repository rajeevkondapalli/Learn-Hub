const aliases={
    "htmlcss":"html-css",
    "datascience":"data-science",
    "ethicalhacking":"ethical-hacking"
};

const params=new URLSearchParams(window.location.search);

let courseId=params.get("course");

if(courseId && aliases[courseId]){
    courseId=aliases[courseId];
}

const app=document.getElementById("app");

if(!courseId || !courses[courseId]){

    app.innerHTML=`
        <div class="card error">
            <h1>Course Not Found</h1>
            <p>Select a course from the Courses page.</p>
            <a class="home" href="courses.html">← Back to Courses</a>
        </div>
    `;

}else{

    const course=courses[courseId];

    document.title="CSE LearnHub - "+course.title;

    let lessons="";

    course.lessons.forEach((lesson,i)=>{

        lessons+=`
            <div class="lesson" onclick="selectLesson(this)">
                <h3>Lesson ${i+1}: ${lesson.title}</h3>
                <p>${lesson.text}</p>
            </div>
        `;

    });

    let quiz="";

    course.quiz.forEach((q,i)=>{

        let options="";

        q[1].forEach((option,j)=>{

            options+=`
                <label class="option">
                    <input
                        type="radio"
                        name="q${i}"
                        value="${j}"
                    >
                    ${option}
                </label>
            `;

        });

        quiz+=`
            <div class="question">
                <h3>${i+1}. ${q[0]}</h3>
                ${options}
            </div>
        `;

    });

    app.innerHTML=`

        <section class="card">

            <h1>${course.title}</h1>

            <p class="muted">
                ${course.description}
            </p>

        </section>


        <section class="card">

            <h2>🎥 Video</h2>

            <iframe
                class="video"
                src="https://www.youtube.com/embed/${course.video}"
                title="${course.title} video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </section>


        <section class="card">

            <h2>📚 Lessons</h2>

            ${lessons}

        </section>


        <section class="card">

            <h2>📝 Quiz</h2>

            ${quiz}

            <button onclick="checkQuiz()">
                Submit Quiz
            </button>

            <div id="result" class="result"></div>

        </section>

    `;

    window.currentCourse=course;
}


function selectLesson(element){

    document
        .querySelectorAll(".lesson")
        .forEach(x=>x.classList.remove("active"));

    element.classList.add("active");

}


function checkQuiz(){

    const course=window.currentCourse;

    let score=0;

    course.quiz.forEach((q,i)=>{

        const selected=
            document.querySelector(
                `input[name="q${i}"]:checked`
            );

        if(
            selected &&
            Number(selected.value)===q[2]
        ){

            score++;

        }

    });

    document.getElementById("result").textContent=
        `Your Score: ${score} / ${course.quiz.length}`;

}
