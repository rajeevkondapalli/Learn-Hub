const aliases={
    "htmlcss":"html-css",
    "datascience":"data-science",
    "ethicalhacking":"ethical-hacking"
};

const params=new URLSearchParams(window.location.search);

let courseId=params.get("course");

if(courseId && aliases[courseId]){
    courseId=aliases[courseId];
}

const app=document.getElementById("app");

if(!courseId || !courses[courseId]){

    app.innerHTML=`
        <div class="card error">
            <h1>Course Not Found</h1>
            <p>Select a course from the Courses page.</p>
            <a class="home" href="courses.html">← Back to Courses</a>
        </div>
    `;

}else{

    const course=courses[courseId];

    document.title="CSE LearnHub - "+course.title;

    const storageKey="learnhub-progress-"+courseId;

    let done=[];

    try{
        done=JSON.parse(localStorage.getItem(storageKey))||[];
    }catch(e){
        done=[];
    }

    let lessons="";

    course.lessons.forEach((lesson,i)=>{

        const isDone=done.includes(i);

        lessons+=`
            <div class="lesson ${isDone?"done":""}" data-index="${i}" onclick="selectLesson(this)">
                <div class="lesson-head">
                    <h3>Lesson ${i+1}: ${lesson.title}</h3>
                    <span class="lesson-check">&#10003;</span>
                </div>
                <p>${lesson.text}</p>
            </div>
        `;

    });

    let quiz="";

    course.quiz.forEach((q,i)=>{

        const explanation=q[3]||("Correct answer: "+q[1][q[2]]);

        let options="";

        q[1].forEach((option,j)=>{

            options+=`
                <label class="option">
                    <input
                        type="radio"
                        name="q${i}"
                        value="${j}"
                    >
                    ${option}
                </label>
            `;

        });

        quiz+=`
            <div class="question">
                <h3>${i+1}. ${q[0]}</h3>
                ${options}
                <div class="explain" id="explain-${i}">
                    💡 ${explanation}
                </div>
            </div>
        `;

    });

    app.innerHTML=`

        <section class="card">

            <h1>${course.title}</h1>

            <p class="muted">
                ${course.description}
            </p>

            <div class="progress-wrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText"></span>
            </div>

        </section>


        <section class="card">

            <h2>🎥 Video</h2>

            <iframe
                class="video"
                src="https://www.youtube.com/embed/${course.video}"
                title="${course.title} video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </section>


        <section class="card">

            <h2>📚 Lessons</h2>

            ${lessons}

        </section>


        <section class="card">

            <h2>📝 Quiz</h2>

            ${quiz}

            <button class="btn" onclick="checkQuiz()">
                Submit Quiz
            </button>

            <div id="result" class="result"></div>

        </section>

    `;

    window.currentCourse=course;
    window.progressKey=storageKey;
    window.doneLessons=done;

    updateProgress();
}

function updateProgress(){

    const total=window.currentCourse.lessons.length;
    const done=window.doneLessons.length;
    const pct=Math.round((done/total)*100);

    const fill=document.getElementById("progressFill");
    const text=document.getElementById("progressText");

    if(fill){
        fill.style.width=pct+"%";
    }

    if(text){
        text.textContent=done+" / "+total+" lessons";
    }

}

function selectLesson(element){

    element.classList.toggle("active");

    const index=Number(element.dataset.index);

    if(!window.doneLessons.includes(index)){

        window.doneLessons.push(index);

        element.classList.add("done");

        try{
            localStorage.setItem(
                window.progressKey,
                JSON.stringify(window.doneLessons)
            );
        }catch(e){}

        updateProgress();

    }

}

function checkQuiz(){

    const course=window.currentCourse;

    let score=0;

    course.quiz.forEach((q,i)=>{

        const selected=
            document.querySelector(
                `input[name="q${i}"]:checked`
            );

        document
            .querySelectorAll(`input[name="q${i}"]`)
            .forEach(input=>{

                const label=input.closest(".option");

                label.classList.remove("correct","wrong");

                if(Number(input.value)===q[2]){
                    label.classList.add("correct");
                }

            });

        if(selected && Number(selected.value)===q[2]){
            score++;
        }else if(selected){
            selected.closest(".option").classList.add("wrong");
        }

        const explain=document.getElementById("explain-"+i);

        if(explain){
            explain.classList.add("show");
        }

    });

    document
        .querySelectorAll('input[type="radio"]')
        .forEach(input=>input.disabled=true);

    const total=course.quiz.length;
    const pct=Math.round((score/total)*100);

    let message="Keep practicing! 💪";

    if(pct===100){
        message="Perfect! 🎉";
    }else if(pct>=50){
        message="Good job! 👍";
    }

    document.getElementById("result").textContent=
        `Your Score: ${score} / ${total} (${pct}%) — ${message}`;

}
